<!DOCTYPE html>
<!--Türkçe dilini kullan-->
<html lang="tr">

<head>
  <!--Türkçe karakter sorunu çözsün:üğşçöıÜĞŞÇÖİ-->
  <meta charset="UTF-8">
  <!-- Resposive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full stack developer</title>
  <link rel="icon" type="image/x-icon" href="./assets/css/favicon.jpg" />
  <meta name="keywords" content="html5,css3,js,es5,es6,ts,node,bs5" />
  <meta name="author" content="MsC Mustafa Eral" />
  <meta name="description" content="Full stack developer nedir?" />
</head>

<body>
  <noscript>
    <!--JavaScript devre dışı bırakılmışsa gösterilecek içerik-->
    <p>
         Bu site JavaScript gerektirir. Lütfen JavaScript'i etkinleştirin ve sayfayı yeniden yükleyin.
        </p>
  </noscript>
  <!-- Start Code -->

  <main class="site-shell">

    <!--form card-->
    <section class="form-card" id="form" aria-labelledby="form-title">

      <div class="form-header">
        <h2 id="form-title">Eğitim/Danışmanlık Başvuru Formu</h2>
        <p>Bilgilerinizi eksiksiz giriniz(*)</p>
      </div>
    </section>

    <!--form-->
   <form action="#" method="get">
    <fielset>
        <legend>Kişisel Bilgiler</legend>
        <div class="form-row">

            <!--Adınız ve Soyadınız *-->
            <div class="input-group">
            <label for="fullname">Adınız ve Soyadınız</label>
            <input 
            type="text" 
            id="fullname" 
            name="fullname"
            placeholder="Adınız ve Soyadınız..." 
            minlenght="3" 
            required 
            autofocus/>
             <small class="input-help">En az 3 karakter uzunluğunda olmalıdır.</small>
        </div>


                   <!--Email *-->
            <div class="input-group">
            <label for="email">E-mail (*)</label>
            <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="örnek:hamitmizrak@gmail.com"
            required 
          />
             <small class="input-help">örnek:hamitmizrak@gmail.com</small>
        </div>


                   <!--Telefon numaranız *-->
            <div class="input-group">
            <label for="phone">Telefon numaranız (*)</label>
            <input 
            type="tel" 
            id="phone" 
            name="phone"
            placeholder="Adı+90 111 222 33 44"
            pattern="[0-9s()+-]{10,18}"
            required 
          />
             <small class="input-help">Sadece telefon formatına uygun uygun karakterler
              kullanılabilir.</small>
        </div>
                   <!--City *-->
            <div class="input-group">
            <label for="city">Şehir (*)</label>
            <select id="city" name="city" required>
                <option value="" selected disabled>Şehir Seçiniz</option>
                <option value="istanbul">İstanbul</option>
                <option value="ankara">Ankara</option>
                <option value="izmir">İzmir</option>
                <option value="bursa">Bursa</option>
                <option value="antalya">Antalya</option>
             <small class="input-help">Şehir bilgisi gereklidir.</small>




    </fielset>
   </form>
  </main>
    

  <!-- End Code -->
</body>
</html>
